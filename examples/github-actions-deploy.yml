# Example GitHub Actions deploy job using non-interactive Servers Are Up guest exec
# Never stores long-lived root SSH private keys in GitHub Secrets.
name: Deploy to Servers Are Up VPS
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull and restart container stack via /api/v1/instances/{id}/exec
        env:
          SAU_API_TOKEN: ${{ secrets.SAU_API_TOKEN }}
          SAU_INSTANCE_ID: ${{ vars.SAU_INSTANCE_ID }}
        run: |
          curl -fsSL -X POST "https://serversareup.com/api/v1/instances/${SAU_INSTANCE_ID}/exec" \
            -H "Authorization: Bearer ${SAU_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"command":"cd /srv/app && git pull --ff-only && docker compose up -d --build","timeoutMs":55000}'
